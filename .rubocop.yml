plugins:
  - rubocop-minitest

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - vendor/**/*
    - tmp/**/*

Style/Documentation:
  Enabled: false

Naming/MethodName:
  AllowedPatterns:
    - \A[A-Z][A-Za-z0-9_]*\z

Style/ArgumentsForwarding:
  Enabled: false

Naming/BlockForwarding:
  Enabled: false

Metrics/AbcSize:
  Max: 25
  Exclude:
    - test/**/*

Metrics/MethodLength:
  Max: 20

Metrics/BlockLength:
  Exclude:
    - test/**/*
    - "*.gemspec"

Metrics/ClassLength:
  # Driver は五点セットを綴じる中核で、修正前でちょうど 100/100 の天井に居た。
  # replay 不一致の検出を入れて 101 行になったぶんの余白。責務分割 (replay 境界の
  # 切り出し) は意図して別に行うので、それまでの暫定上限。
  Max: 110
  Exclude:
    - test/**/*

Metrics/ModuleLength:
  Max: 140

Metrics/CyclomaticComplexity:
  Max: 9

Metrics/PerceivedComplexity:
  Max: 9

Metrics/ParameterLists:
  Max: 7

Minitest/MultipleAssertions:
  Exclude:
    - test/**/*

# Gear::Journal::Log#append is immutable and returns a new Log. Assignment is
# required to preserve the append-only journal semantics.
Style/RedundantSelfAssignment:
  Enabled: false
